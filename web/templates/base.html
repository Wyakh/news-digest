<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}News Digest{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('digest_css') }}">
    <style>
        .topnav {
            max-width: 820px;
            margin: 0 auto;
            padding: 1em 2.5em 0.5em;
            font-family: "Arial", "Helvetica Neue", Helvetica, sans-serif;
            font-size: 10pt;
            color: #666;
            border-bottom: 1px solid #eee;
            margin-bottom: 1em;
        }
        .topnav a {
            color: #1a4a8a;
            text-decoration: none;
            border-bottom: none;
        }
        .topnav a:hover {
            border-bottom: 1px solid #1a4a8a;
        }
        .topnav .sep {
            color: #ccc;
            margin: 0 0.6em;
        }
    </style>
</head>
<body>
    <div class="topnav">
        <a href="{{ url_for('index') }}">All digests</a>
        <span class="sep">·</span>
        <a href="{{ url_for('status') }}">Status</a>
        <span class="sep">·</span>
        <a href="{{ url_for('cost') }}">Cost</a>
        <span class="sep">·</span>
        <a href="{{ url_for('run_page') }}">Run</a>
        <span class="sep">·</span>
        <a href="{{ url_for('inspect_page') }}">Inspect</a>
        <span class="sep">·</span>
        <a href="{{ url_for('settings_index') }}">Settings</a>
        <span class="sep">·</span>
        <a href="{{ url_for('notes_page') }}">Notes</a>
    </div>
    {% block content %}{% endblock %}
</body>
</html>
